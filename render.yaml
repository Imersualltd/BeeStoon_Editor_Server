services:
  - type: web
    name: be-water-multiplayer
    # Docker so the server image can include the assimp
    # tool needed for GLB -> FBX export (see Dockerfile).
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Closest Render region to Europe / Middle East
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Development: trust the name the client sends.
      # Switch to AUTH_PROVIDER=jwt (+ JWT_SECRET or
      # JWT_PUBLIC_KEY) for the BeeStoon build.
      - key: AUTH_PROVIDER
        value: dev
      - key: ALLOW_DEV_AUTH
        value: "true"
      # AR share links: "local" until DigitalOcean Spaces
      # is set up (then AR_STORAGE=s3 + S3_* keys, see README)
      - key: AR_STORAGE
        value: local
      - key: AR_LINK_HOURS
        value: "24"
